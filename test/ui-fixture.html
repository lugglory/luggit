async function runConflictTest() {
  const preview = { name: '충돌한 메모.md', result: '공통 내용\n내 메모\n상대 메모\n', count: 1, reason: '' };

  await gitPlugin.showConflict(preview.name);
  const first = lastModal;

  const result = { labels, text: first.contentEl.querySelector('pre').textContent, focus: document.activeElement.textContent };
  first.modalEl.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  result.cancelled = calls.length === 0;
  await gitPlugin.showConflict(preview.name);
  [...lastModal.contentEl.querySelectorAll('button')].find(el => el.textContent === '적용하고 해결로 표시').click();
  preview.result = null; preview.reason = 'YAML 충돌은 직접 검토해 주세요.';
  await gitPlugin.showConflict(preview.name);

  result.calls = calls;
  preview.result = '공통 내용\n내 메모\n상대 메모\n'; preview.reason = '';

async function runPanelOpenTest() {
